<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل مدیریت - ZLT X28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block bg-sky-500/10 text-sky-400 p-3 rounded-2xl mb-4 border border-sky-500/20 text-2xl">
                🔐
            </div>
            <h1 class="text-xl font-bold text-white">ورود به پنل مدیریت</h1>
            <p class="text-xs text-slate-400 mt-1">اطلاعات ورود ادمین را وارد کنید</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-3 rounded-xl text-xs text-center mb-6">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1.5">نام کاربری ادمین</label>
                <input type="text" name="username" required value="admin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-sky-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1.5">رمز عبور ادمین</label>
                <div class="relative">
                    <input type="password" id="admin-password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-sky-500 focus:outline-none transition pl-12" placeholder="رمز عبور را وارد کنید">
                    <button type="button" onclick="togglePassword()" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs px-2 py-1 transition">
                        👁️
                    </button>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-sky-500/20 mt-2">
                ورود به مدیریت
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-400 transition">← بازگشت به صفحه اصلی</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('admin-password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }
    </script>
</body>
</html>
