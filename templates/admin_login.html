<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به بخش مدیریت - ZLT X28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; overflow: hidden; }
        @keyframes floatAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .float-box { animation: floatAnim 4s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); } 50% { box-shadow: 0 0 40px rgba(56, 189, 248, 0.3); } }
        .glow-card { animation: pulseGlow 3s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
    
    <!-- Toast تایید ورود -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-500 text-slate-950 px-6 py-3 rounded-2xl font-bold shadow-2xl flex items-center gap-3 transform translate-y-32 opacity-0 transition-all duration-700 z-50">
        <span class="text-xl">🎉</span>
        <span>با موفقیت وارد بخش مدیریت شدید!</span>
    </div>

    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl glow-card float-box transition-all duration-500">
        <div class="text-center mb-8">
            <div class="inline-block bg-gradient-to-tr from-sky-500 to-indigo-500 text-slate-950 p-4 rounded-2xl mb-4 shadow-lg text-3xl">
                👑
            </div>
            <!-- متن دقیق درخواستی شما -->
            <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-300">ورود به بخش مدیریت</h1>
            <p class="text-xs text-slate-400 mt-2">سیستم امنیتی کنترلر مودم ZLT X28</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-3 rounded-2xl text-xs text-center mb-6 animate-bounce">
            {{ error }}
        </div>
        {% endif %}

        <form id="loginForm" action="/admin" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs text-slate-400 mb-2">نام کاربری ادمین</label>
                <input type="text" name="username" required value="admin" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-sm text-white focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 focus:outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-2">رمز عبور ادمین</label>
                <div class="relative">
                    <input type="password" id="admin-password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-sm text-white focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 focus:outline-none transition-all pl-12" placeholder="رمز عبور...">
                    <button type="button" onclick="togglePassword()" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">
                        👁️
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="rounded bg-slate-950 border-slate-800 text-sky-500 focus:ring-0 w-4 h-4">
                    <span>مرا به خاطر بسپار</span>
                </label>
            </div>
            
            <button type="submit" onclick="handleLoginSuccess(event)" class="w-full bg-gradient-to-r from-sky-400 to-indigo-500 hover:from-sky-300 hover:to-indigo-400 text-slate-950 font-extrabold py-3.5 rounded-2xl text-sm transition-all transform hover:scale-[1.02] shadow-xl shadow-sky-500/20 mt-2">
                ورود ایمن به پنل
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-xs text-slate-500 hover:text-sky-400 transition">← بازگشت به صفحه اصلی سایت</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('admin-password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('zlt_admin_user');
            if(savedUser) {
                document.querySelector('input[name="username"]').value = savedUser;
                document.getElementById('rememberMe').checked = true;
            }
        }

        function handleLoginSuccess(event) {
            const usernameInput = document.querySelector('input[name="username"]').value;
            const passInput = document.querySelector('input[name="password"]').value;
            const rememberEl = document.getElementById('rememberMe').checked;

            if(usernameInput === 'admin' && passInput === 'Khani_1396') {
                if(rememberEl) localStorage.setItem('zlt_admin_user', usernameInput);
                else localStorage.removeItem('zlt_admin_user');
                
                event.preventDefault();
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-32', 'opacity-0');
                
                setTimeout(() => {
                    document.getElementById('loginForm').submit();
                }, 1200);
            }
        }
    </script>
</body>
</html>
